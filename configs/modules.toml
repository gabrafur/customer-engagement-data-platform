[[modules]]
id = "pipeline-core"
version = "0.2.0"
paths = [
  "src/engagement_platform/*.py",
  "configs/*.yml",
  "sql/*.sql",
]
checks = ["lint", "type-check", "unit-tests", "integration-tests"]

[[modules]]
id = "distributed-runtime"
version = "0.2.0"
paths = [
  "src/engagement_platform/spark_*.py",
  "resources/*.yml",
  "databricks.yml",
]
checks = ["spark-tests", "bundle-review"]

[[modules]]
id = "documentation"
version = "0.2.0"
paths = [
  "README.md",
  "docs/*.md",
  "docs/**/*.md",
  "docs/*.mmd",
  "docs/assets/*.svg",
  "docs/assets/*.png",
]
checks = ["link-check", "content-scan"]
