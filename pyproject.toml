[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "customer-engagement-data-platform"
version = "0.1.0"
description = "A synthetic, configuration-driven data engineering portfolio project."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Gabriel Furlan" }]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
spark = [
  "delta-spark>=3.2,<4",
  "pyspark>=3.5,<3.6",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
engagement-platform = "engagement_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engagement_platform"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov=engagement_platform --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = ["spark: tests that require a local Spark runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true
