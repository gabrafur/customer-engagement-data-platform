name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install public dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,spark]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Validate modular CI registry
        run: engagement-platform impact --registry configs/modules.toml --changed src/engagement_platform/dag.py docs/architecture.md
      - name: Test
        run: pytest
      - name: Build wheel
        run: python -m build --wheel
      - name: Security and content scan
        run: python scripts/security_scan.py .
